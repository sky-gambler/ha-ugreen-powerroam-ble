# Tooling only: the integration itself is installed by HACS as a folder,
# not as a Python package.
[project]
name = "ha-ugreen-powerroam-ble"
version = "1.1.0"
description = "Home Assistant integration for UGREEN PowerRoam power stations over Bluetooth LE"
requires-python = ">=3.13"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "PT", "RUF"]
ignore = [
    "RUF001", # the docs and translations use typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Compound asserts and bare ValueError checks read better in these tests.
"tests/*" = ["PT011", "PT018"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
